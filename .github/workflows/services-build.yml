name: Web and Backend Build
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  services:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    strategy:
      matrix:
        dir: [backend, web]
    defaults:
      run:
        working-directory: ${{ matrix.dir }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm run build
      - if: ${{ matrix.dir == 'backend' }}
        run: npm test
